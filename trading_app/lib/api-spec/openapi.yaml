openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DEX Perpetual Funding Arbitrage Monitor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: Arbitrage scanner operations
  - name: markets
    description: Market data operations
  - name: spot
    description: Spot arbitrage scanner operations
  - name: wallet
    description: Wallet balance operations
  - name: alerts
    description: Telegram alert configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scanner/status:
    get:
      operationId: getScannerStatus
      tags: [scanner]
      summary: Get scanner and exchange status
      description: Returns the live status of the arbitrage scanner and each exchange
      responses:
        "200":
          description: Scanner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerStatus"

  /scanner/opportunities:
    get:
      operationId: getOpportunities
      tags: [scanner]
      summary: Get current arbitrage opportunities
      description: Returns live arbitrage opportunities sorted by funding rate diff descending
      parameters:
        - name: targetedSpread
          in: query
          required: false
          schema:
            type: number
          description: Targeted spread threshold in percent (e.g. 0.5 = 0.5%). When provided, spreadTimesHit is the count of 1-second samples where spreadPct ≤ this value.
      responses:
        "200":
          description: List of arbitrage opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArbitrageOpportunity"

  /markets:
    get:
      operationId: getMarkets
      tags: [markets]
      summary: Get all market data per exchange
      description: Returns all instruments across all exchanges with current market data
      responses:
        "200":
          description: Market data grouped by exchange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketsResponse"

  /spot/status:
    get:
      operationId: getSpotStatus
      tags: [spot]
      summary: Get spot scanner status
      description: Returns the live status of each spot exchange feed
      responses:
        "200":
          description: Spot scanner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotStatus"

  /spot/opportunities:
    get:
      operationId: getSpotOpportunities
      tags: [spot]
      summary: Get spot arbitrage opportunities
      description: Returns spot price arbitrage opportunities sorted by price diff descending
      parameters:
        - name: minDiffPct
          in: query
          required: false
          schema:
            type: number
          description: Minimum price difference % to include (default 0)
        - name: targetedNetProfit
          in: query
          required: false
          schema:
            type: number
          description: "Target net profit % threshold — profitTimesHit on each opportunity counts 4h samples where netProfitPct ≥ this value"
      responses:
        "200":
          description: List of spot arbitrage opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpotOpportunity"

  /wallet/balances:
    get:
      operationId: getWalletBalances
      tags: [wallet]
      summary: Get wallet balances from all exchanges
      description: Fetches live spot/unified account balances from Binance, Bybit, KuCoin and Bitget using configured API keys
      responses:
        "200":
          description: Wallet balances per exchange
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeWallet"

  /alerts/config:
    get:
      operationId: getAlertsConfig
      tags: [alerts]
      summary: Get current Telegram alert configuration
      responses:
        "200":
          description: Current alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
    put:
      operationId: updateAlertsConfig
      tags: [alerts]
      summary: Update Telegram alert configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertConfigUpdate"
      responses:
        "200":
          description: Updated alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfig"
        "400":
          description: Invalid config values

  /alerts/history:
    get:
      operationId: getAlertsHistory
      tags: [alerts]
      summary: Get history of sent Telegram alerts
      responses:
        "200":
          description: List of sent alerts newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertEvent"

  /alerts/test:
    post:
      operationId: sendTestAlert
      tags: [alerts]
      summary: Send a test Telegram message to verify configuration
      responses:
        "200":
          description: Test message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertTestResult"
        "502":
          description: Telegram API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertTestResult"

  /alerts/detect-chat-id:
    post:
      operationId: detectChatId
      tags: [alerts]
      summary: Auto-detect Telegram Chat ID from recent bot messages
      description: Calls Telegram getUpdates, extracts the first chat ID found, and persists it to disk. The user must send any message to the bot first.
      responses:
        "200":
          description: Chat ID detected and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectChatIdResult"
        "422":
          description: No message found or token not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectChatIdResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ExchangeStatus:
      type: object
      properties:
        exchange:
          type: string
          enum: [pi42, aster, delta, coinswitch]
        status:
          type: string
          enum: [online, degraded, offline]
        lastDataAt:
          type: ["integer", "null"]
          description: Epoch ms of last received data
        errorMessage:
          type: ["string", "null"]
          description: Last connection error if any
        instrumentCount:
          type: integer
          description: Number of instruments with live data
      required:
        - exchange
        - status
        - lastDataAt
        - errorMessage
        - instrumentCount

    ScannerStatus:
      type: object
      properties:
        running:
          type: boolean
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeStatus"
        opportunityCount:
          type: integer
        lastUpdatedAt:
          type: ["integer", "null"]
      required:
        - running
        - exchanges
        - opportunityCount
        - lastUpdatedAt

    ArbitrageOpportunity:
      type: object
      properties:
        symbol:
          type: string
          description: Canonical symbol e.g. BTC
        longExchange:
          type: string
          description: Exchange to go long (lower funding rate)
        shortExchange:
          type: string
          description: Exchange to go short (higher funding rate)
        longAsk:
          type: number
          description: Best ask price at long exchange (entry price for long leg)
        shortBid:
          type: number
          description: Best bid price at short exchange (entry price for short leg)
        longFundingRate:
          type: number
          description: Funding rate at long exchange (per 8h, decimal)
        shortFundingRate:
          type: number
          description: Funding rate at short exchange (per 8h, decimal)
        fundingRateDiff:
          type: number
          description: shortFundingRate - longFundingRate (per 8h, decimal, always positive)
        spreadPct:
          type: number
          description: "(shortBid - longAsk) / longAsk — signed decimal; negative means cross-spread cost"
        longMakerFee:
          type: number
          description: Per-trade maker fee at long exchange (decimal)
        longTakerFee:
          type: number
          description: Per-trade taker fee at long exchange (decimal)
        shortMakerFee:
          type: number
          description: Per-trade maker fee at short exchange (decimal)
        shortTakerFee:
          type: number
          description: Per-trade taker fee at short exchange (decimal)
        totalFees:
          type: number
          description: "(longMakerFee + shortMakerFee) × 2 — round-trip maker fees (decimal)"
        netProfit:
          type: number
          description: fundingRateDiff + spreadPct - totalFees (decimal, sorted descending)
        longFundingIntervalMs:
          type: integer
          description: Funding interval at long exchange in ms (28800000=8h, 14400000=4h)
        shortFundingIntervalMs:
          type: integer
          description: Funding interval at short exchange in ms (28800000=8h, 14400000=4h)
        nextFundingAt:
          type: integer
          description: Epoch ms of next funding settlement (sooner of the two legs)
        updatedAt:
          type: integer
          description: Epoch ms of last update
        longMaxLeverage:
          type: ["integer", "null"]
          description: Max leverage at long exchange for this symbol (null if unknown)
        shortMaxLeverage:
          type: ["integer", "null"]
          description: Max leverage at short exchange for this symbol (null if unknown)
        spreadSampleCount:
          type: integer
          description: Number of 1-second spread samples recorded in the rolling 5-hour window
        lowestSpreadPct:
          type: number
          description: Minimum spreadPct observed in the 5-hour window (decimal)
        spreadTimesHit:
          type: integer
          description: Samples where spreadPct was at or below the requested targetedSpread threshold
      required:
        - symbol
        - longExchange
        - shortExchange
        - longAsk
        - shortBid
        - longFundingRate
        - shortFundingRate
        - fundingRateDiff
        - spreadPct
        - longMakerFee
        - longTakerFee
        - shortMakerFee
        - shortTakerFee
        - totalFees
        - netProfit
        - longFundingIntervalMs
        - shortFundingIntervalMs
        - nextFundingAt
        - updatedAt
        - longMaxLeverage
        - shortMaxLeverage
        - spreadSampleCount
        - lowestSpreadPct
        - spreadTimesHit

    MarketTick:
      type: object
      properties:
        symbol:
          type: string
        exchange:
          type: string
        bestBid:
          type: number
        bestAsk:
          type: number
        markPrice:
          type: ["number", "null"]
        fundingRate:
          type: number
          description: Normalized to per-8h, raw decimal
        fundingIntervalMs:
          type: integer
          description: Funding settlement interval in ms (28800000=8h, 14400000=4h)
        nextFundingAt:
          type: integer
          description: Epoch ms of next funding settlement (UTC-aligned)
        spreadPct:
          type: number
          description: (ask - bid) / mid * 100
        receivedAt:
          type: integer
      required:
        - symbol
        - exchange
        - bestBid
        - bestAsk
        - markPrice
        - fundingRate
        - fundingIntervalMs
        - nextFundingAt
        - spreadPct
        - receivedAt

    MarketsResponse:
      type: object
      properties:
        pi42:
          type: array
          items:
            $ref: "#/components/schemas/MarketTick"
        aster:
          type: array
          items:
            $ref: "#/components/schemas/MarketTick"
        delta:
          type: array
          items:
            $ref: "#/components/schemas/MarketTick"
        coinswitch:
          type: array
          items:
            $ref: "#/components/schemas/MarketTick"
      required:
        - pi42
        - aster
        - delta
        - coinswitch

    SpotExchangePrice:
      type: object
      properties:
        exchange:
          type: string
        bid:
          type: number
        ask:
          type: number
      required:
        - exchange
        - bid
        - ask

    SpotFeeBreakdown:
      type: object
      properties:
        buyFeeRate:
          type: number
          description: Taker fee on the buy exchange (we hit the ask for instant fill); decimal, e.g. 0.001 = 0.10%
        sellFeeRate:
          type: number
          description: Taker fee on the sell exchange (we hit the bid for instant fill); decimal
        withdrawFeeInCoin:
          type: ["number", "null"]
          description: Withdrawal fee in base coin units leaving the buy exchange; null if unknown
        withdrawFeeUSD:
          type: ["number", "null"]
          description: Withdrawal fee in USD (withdrawFeeInCoin × buyAsk); null if unknown
        withdrawNetwork:
          type: ["string", "null"]
          description: Canonical network used for cheapest matched transfer (e.g. BEP20, SOL, ARBITRUM); null if no match
        withdrawFeeKnown:
          type: boolean
          description: Whether a common transfer network was found and fees are included in netProfitPct
        depositFeeInCoin:
          type: ["number", "null"]
          description: Deposit fee charged by sell exchange on the matched network (coin units; almost always 0); null if unknown
        totalTransferFeeInCoin:
          type: ["number", "null"]
          description: Total transfer cost = withdrawFee + depositFee (coin units); null if unknown
        feeSource:
          type: ["string", "null"]
          enum: ["api", "static", null]
          description: "api = withdrawal data from live exchange API; static = manually maintained table"
        addressVerified:
          type: ["boolean", "null"]
          description: "true = both exchanges' contract addresses on the matched network were equal; false = network matched but at least one side did not expose an address (lower confidence — verify manually before trading); null = no route"
        routesConsidered:
          type: ["integer", "null"]
          description: "Total number of compatible networks considered before picking the cheapest one shown. 1 = only one option existed; >1 = the displayed network is the cheapest of N alternatives; null = no route."
        speedTier:
          type: ["string", "null"]
          enum: ["fast", "medium", null]
          description: "Speed tier of the chosen network: fast (<5 min) | medium (5–30 min). Slow networks (BTC, LTC, DOGE, BCH …) are filtered out and never appear. null = no route."
        addressConfirmedCount:
          type: ["integer", "null"]
          description: "Number of consecutive daily refreshes that returned the exact same deposit address for this coin on the sell exchange. Bot eligibility requires ≥10. null = no route."
        feeTaxRate:
          type: number
          description: "Tax surcharge applied to taker fees on both legs in the netProfitPct calculation (decimal, e.g. 0.18 = 18% GST). Effective fee = buyFeeRate × (1 + feeTaxRate)."
        tdsRate:
          type: number
          description: "TDS (Tax Deducted at Source) rate applied on sell-leg gross proceeds in netProfitPct (decimal, e.g. 0.01 = 1%). Indian crypto rules: 1% withheld on every sell."
      required:
        - buyFeeRate
        - sellFeeRate
        - withdrawFeeInCoin
        - withdrawFeeUSD
        - withdrawNetwork
        - withdrawFeeKnown
        - depositFeeInCoin
        - totalTransferFeeInCoin
        - feeSource
        - addressVerified
        - routesConsidered
        - speedTier
        - addressConfirmedCount
        - feeTaxRate
        - tdsRate

    SpotOpportunity:
      type: object
      properties:
        symbol:
          type: string
          description: Canonical symbol e.g. BTC
        buyExchange:
          type: string
          description: Exchange with lowest ask — buy here
        sellExchange:
          type: string
          description: Exchange with highest bid — sell here
        buyAsk:
          type: number
          description: Lowest ask price across exchanges
        sellBid:
          type: number
          description: Highest bid price across exchanges
        priceDiffPct:
          type: number
          description: "(sellBid - buyAsk) / buyAsk * 100 — gross price difference %"
        netProfitPct:
          type: number
          description: Net profit % after maker fee + taker fee + withdrawal fee
        fees:
          $ref: "#/components/schemas/SpotFeeBreakdown"
        allPrices:
          type: array
          items:
            $ref: "#/components/schemas/SpotExchangePrice"
          description: All exchange prices for this symbol sorted by bid descending
        updatedAt:
          type: integer
          description: Epoch ms of last update
        profitTimesHit:
          type: integer
          description: "Count of 1-second samples in the 4h window where netProfitPct >= targetedNetProfit (each count = 1 second at or above threshold)"
        highestNetProfitPct:
          type: ["number", "null"]
          description: "Highest netProfitPct recorded in the rolling 4h window (null = no history yet)"
        lowestNetProfitPct:
          type: ["number", "null"]
          description: "Lowest netProfitPct recorded in the rolling 4h window (null = no history yet)"
      required:
        - symbol
        - buyExchange
        - sellExchange
        - buyAsk
        - sellBid
        - priceDiffPct
        - netProfitPct
        - fees
        - allPrices
        - updatedAt
        - profitTimesHit
        - highestNetProfitPct
        - lowestNetProfitPct

    SpotExchangeStatus:
      type: object
      properties:
        exchange:
          type: string
        status:
          type: string
          enum: [online, offline]
        dataSource:
          type: string
          enum: [ws, rest]
        symbolCount:
          type: integer
        lastFetchAt:
          type: ["integer", "null"]
      required:
        - exchange
        - status
        - dataSource
        - symbolCount
        - lastFetchAt

    SpotStatus:
      type: object
      properties:
        running:
          type: boolean
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/SpotExchangeStatus"
        opportunityCount:
          type: integer
        lastUpdatedAt:
          type: ["integer", "null"]
      required:
        - running
        - exchanges
        - opportunityCount
        - lastUpdatedAt

    WalletAsset:
      type: object
      properties:
        coin:
          type: string
          description: Asset symbol e.g. USDT
        free:
          type: number
          description: Available (withdrawable) amount
        locked:
          type: number
          description: Amount locked in orders
        usdtValue:
          type: number
          description: Approximate USDT value of this asset (0 if unknown)
      required: [coin, free, locked, usdtValue]

    AlertConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether alerts are active
        minNetProfitPct:
          type: number
          description: Minimum net profit % to trigger an alert (e.g. 0.5 = +0.5%)
        minTimesHit:
          type: integer
          description: Minimum Times Hit (4H) count required to trigger alert. 0 = disabled (no minimum).
        cooldownMinutes:
          type: integer
          description: Minutes to wait before re-alerting the same symbol+route
        maxPriceMovementPct:
          type: ["number", "null"]
          description: Skip alert if |price movement| exceeds this % over the chosen period. null = no limit.
        priceMovementPeriodMs:
          type: integer
          description: Time window (ms) used for the price movement filter. One of 14400000 (4H), 28800000 (8H), 43200000 (12H), 86400000 (24H).
        detectedChatId:
          type: ["string", "null"]
          description: Chat ID auto-detected via getUpdates and persisted to disk. Takes priority over TELEGRAM_CHAT_ID env var.
        tokenConfigured:
          type: boolean
          description: true if TELEGRAM_BOT_TOKEN env var is set
        telegramConfigured:
          type: boolean
          description: true if both TELEGRAM_BOT_TOKEN and a chat ID (detected or env var) are available
      required: [enabled, minNetProfitPct, minTimesHit, cooldownMinutes, maxPriceMovementPct, priceMovementPeriodMs, detectedChatId, tokenConfigured, telegramConfigured]

    AlertConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        minNetProfitPct:
          type: number
        minTimesHit:
          type: integer
          description: Minimum Times Hit (4H). 0 = disabled.
        cooldownMinutes:
          type: integer
        maxPriceMovementPct:
          type: ["number", "null"]
        priceMovementPeriodMs:
          type: integer

    AlertEvent:
      type: object
      properties:
        sentAt:
          type: integer
          description: Epoch ms when the alert was sent
        symbol:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        netProfitPct:
          type: number
          description: Net profit % at time of alert
        message:
          type: string
          description: Raw message text sent to Telegram
      required: [sentAt, symbol, buyExchange, sellExchange, netProfitPct, message]

    AlertTestResult:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: ["string", "null"]
      required: [ok, error]

    DetectChatIdResult:
      type: object
      properties:
        ok:
          type: boolean
        chatId:
          type: ["string", "null"]
          description: Detected and saved Chat ID, or null on failure
        error:
          type: ["string", "null"]
          description: Error message on failure, null on success
      required: [ok, chatId, error]

    ExchangeWallet:
      type: object
      properties:
        exchange:
          type: string
          description: Exchange identifier
        status:
          type: string
          enum: [ok, error, no_key]
          description: "ok = fetched; no_key = API keys not configured; error = fetch failed"
        keyConfigured:
          type: boolean
          description: Whether API keys are set in environment
        totalEquityUSDT:
          type: number
          description: Total portfolio equity in USDT
        availableUSDT:
          type: number
          description: Available USDT for spot trading
        assets:
          type: array
          items:
            $ref: "#/components/schemas/WalletAsset"
          description: All non-zero asset balances sorted by USDT value descending
        error:
          type: ["string", "null"]
          description: Error message if status is error
        fetchedAt:
          type: integer
          description: Epoch ms when balance was last fetched
      required:
        - exchange
        - status
        - keyConfigured
        - totalEquityUSDT
        - availableUSDT
        - assets
        - fetchedAt
