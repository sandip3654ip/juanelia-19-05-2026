kind = "web"
previewPath = "/"
title = "DEX Funding Arbitrage Monitor"
version = "1.0.0"
id = "artifacts/dex-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26182

[services.development]
run = "pnpm --filter @workspace/dex-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dex-dashboard", "run", "build" ]
publicDir = "artifacts/dex-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26182"
BASE_PATH = "/"
